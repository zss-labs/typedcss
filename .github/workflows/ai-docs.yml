name: ai-docs
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/scripts/generate-ai.mjs
      - .github/workflows/ai-docs.yml

permissions:
  contents: write

concurrency:
  group: ai-docs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate TypedCSS AI documentation
        run: node docs/scripts/generate-ai.mjs
      - name: Commit generated documentation
        run: |
          file=docs/public/docs/ai.md
          if [ -z "$(git status --porcelain -- "$file")" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'docs: regenerate AI instructions in ai.md'
          git push
