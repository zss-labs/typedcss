[package]
name = "typedcss-oxide"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
globset = "0.4"
ignore = "0.4"
indexmap = "2"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"], optional = true }
napi-derive = { version = "=3.6.0", optional = true }
rayon = "1"
rustc-hash = "2"
ryu-js = "1"
serde_json = { version = "1", features = ["preserve_order"] }
swc_core = { version = "=82.0.2", features = ["common", "ecma_ast", "ecma_codegen", "ecma_parser", "ecma_visit"] }

[build-dependencies]
napi-build = { version = "=2.3.2", optional = true }

[features]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
swc-plugin = []

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
